name: Update Stats

on:
  schedule:
    - cron: '0 6 * * *'   # Her gün 06:00 UTC
  workflow_dispatch:        # Manuel tetikleme

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="NousResearch"
          REPO="hermes-agent"
          PYPI_PKG="hermes-agent"
          AUTH="-H \"Authorization: Bearer $GH_TOKEN\""

          REPO_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$OWNER/$REPO")
          STARS=$(echo "$REPO_DATA"         | jq '.stargazers_count // 0')
          FORKS=$(echo "$REPO_DATA"         | jq '.forks_count // 0')
          OPEN_TOTAL=$(echo "$REPO_DATA"    | jq '.open_issues_count // 0')

          OPEN_PRS=$(curl -sI -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/pulls?state=open&per_page=1" \
            | grep -i "^link:" | grep -oP 'page=\K\d+(?=>; rel="last")' || echo "0")
          [ -z "$OPEN_PRS" ] && OPEN_PRS=0

          CLOSED_PRS=$(curl -sI -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/pulls?state=closed&per_page=1" \
            | grep -i "^link:" | grep -oP 'page=\K\d+(?=>; rel="last")' || echo "0")
          [ -z "$CLOSED_PRS" ] && CLOSED_PRS=0

          CLOSED_ISSUES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/issues?q=repo:$OWNER/$REPO+type:issue+state:closed&per_page=1" \
            | jq '.total_count // 0')

          CONTRIBUTORS=$(curl -sI -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/contributors?per_page=1&anon=1" \
            | grep -i "^link:" | grep -oP 'page=\K\d+(?=>; rel="last")' || echo "0")
          [ -z "$CONTRIBUTORS" ] && CONTRIBUTORS=0

          OPEN_ISSUES=$((OPEN_TOTAL - OPEN_PRS))
          [ $OPEN_ISSUES -lt 0 ] && OPEN_ISSUES=0

          PYPI_MONTH=$(curl -s "https://pypistats.org/api/packages/$PYPI_PKG/recent" \
            | jq '.data.last_month // 4106')
          [ "$PYPI_MONTH" = "null" ] && PYPI_MONTH=4106

          TS=$(date +%s)000

          jq -n \
            --argjson ts           "$TS"            \
            --argjson stars        "$STARS"         \
            --argjson forks        "$FORKS"         \
            --argjson openIssues   "$OPEN_ISSUES"   \
            --argjson closedIssues "$CLOSED_ISSUES" \
            --argjson openPRs      "$OPEN_PRS"      \
            --argjson closedPRs    "$CLOSED_PRS"    \
            --argjson contributors "$CONTRIBUTORS"  \
            --argjson pypiMonth    "$PYPI_MONTH"    \
            '{
              timestamp:    $ts,
              stars:        $stars,
              forks:        $forks,
              openIssues:   $openIssues,
              closedIssues: $closedIssues,
              openPRs:      $openPRs,
              closedPRs:    $closedPRs,
              contributors: $contributors,
              pypiMonth:    $pypiMonth
            }' > stats.json

          echo "stats.json:"
          cat stats.json

      - name: Commit and push
        run: |
          git config user.name "EloquentBrush0x"
          git config user.email "EloquentBrush0x@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || (git commit -m "chore: update daily stats [skip ci]" && git push)
